        // Generador de código único de dispositivo basado en hardware y navegador
        function getDeviceCode() {
            let id = localStorage.getItem("jtr_device_id");
            if (!id) {
                const raw = navigator.userAgent + screen.width + screen.height + Math.random();
                let hash = 0;
                for (let i = 0; i < raw.length; i++) {
                    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                    hash |= 0;
                }
                const codeStr = Math.abs(hash).toString(36).toUpperCase().substring(0, 6);
                id = "UYS-" + (codeStr.length < 6 ? (codeStr + "CUM").substring(0, 6) : codeStr);
                localStorage.setItem("jtr_device_id", id);
            }
            return id;
        }

        function switchTab(tabName) {
            const cBtn = document.getElementById("tabConsultaBtn");
            const oBtn = document.getElementById("tabOracionesBtn");
            const cSec = document.getElementById("sectionConsulta");
            const oSec = document.getElementById("sectionOraciones");

            if (tabName === 'consulta') {
                cBtn.classList.add("active");

                cSec.style.display = "block";
                oSec.style.display = "none";
            } else {
                oBtn.classList.add("active");
                cBtn.classList.remove("active");
                oSec.style.display = "block";
                cSec.style.display = "none";
            }
        }

            }
        }

        function askTopic(topicText) {
            switchTab('consulta');
            document.getElementById("userQuestion").value = topicText;
            handleAsk();
        }

        async function handleAsk() {
            const q = document.getElementById("userQuestion").value.trim();
            if (!q) return;

            if (!isPro && freeLeft <= 0) {
                alert("Has alcanzado el límite de 3 preguntas gratis de hoy. Activa el modo PRO por WhatsApp para seguir conversando con el Maestro.");
                return;
            }

            const responseArea = document.getElementById("responseArea");
            const responseText = document.getElementById("responseText");
            
            responseArea.style.display = "block";
            responseText.innerHTML = "<i>Meditando tu respuesta en las Sagradas Escrituras...</i>";

            let reply = "";

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: q })
                });
                const data = await res.json();
                if (data && data.reply) {
                    reply = data.reply;
                }
            } catch (e) {
                console.log("Modo Offline activado. Usando base de conocimientos local.");
            }

            // Fallback inteligente a la Base de Conocimientos Local (KB)
            if (!reply) {
                const normQ = q.toLowerCase();
                const match = KB.find(k => k.keys.some(key => normQ.includes(key)));
                if (match) {
                    reply = match.voice;
                } else {
                    reply = "Hijo mío, en el silencio de la oración y de la fe hallarás la luz que buscas. Guarda mi palabra en tu corazón y confía plenamente en la providencia del Padre, que cuida de ti en todo momento.";
                }
            }

            responseText.innerText = reply;
            lastResponseText = reply;

            if (!isPro) {
                freeLeft--;
                localStorage.setItem("jtr_free_left", freeLeft);
                updateProUI();
            }

            history.unshift({ q: q, a: reply });
            if (history.length > 5) history.pop();
            localStorage.setItem("jtr_history", JSON.stringify(history));
            renderLists();
        }

            document.getElementById("oracionTitulo").innerText = item.titulo;
            document.getElementById("oracionTexto").innerText = item.texto;
            document.getElementById("oracionVisor").style.display = "block";
            ultimaOracionTexto = item.texto;

        function escucharOracionCargada() {

        // Síntesis de Voz
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.pitch = 0.93;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Tu dispositivo no soporta síntesis de voz.");
            }
        }

        function speakCurrentResponse() {
            if (lastResponseText) speakText(lastResponseText);
        }

        function detenerVoz() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // Reconocimiento de Voz (Micrófono)
        function startVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("El reconocimiento de voz no está disponible en este navegador.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById("userQuestion").value = transcript;
                handleAsk();
            };
        }
